<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhD Life Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>PhD Life Game</h1>
            <p class="subtitle">Experience the journey of a PhD student</p>
        </header>
        
        <main>
            <div class="game-screen hidden" id="game-screen">
                <div class="episode-container">
                    <h2 id="episode-title">Episode 1: The Beginning</h2>
                    <p id="episode-description">You've just started your PhD. What's your first priority?</p>
                </div>
                
                <div class="choices-container" id="choices-container">
                    <!-- Choices will be inserted here by JavaScript -->
                </div>
                
                <div class="skills-container">
                    <h3>Your Skills</h3>
                    <div id="skills-display"></div>
                </div>
            </div>
            
            <div class="game-screen hidden" id="end-screen">
                <h2 id="end-title">Game Over</h2>
                <p id="end-description"></p>
                <button id="restart-btn" class="btn">Play Again</button>
            </div>
        </main>
        
        <footer>
            <p>PhD Life Game - A pedagogical game about the PhD journey | Version: 0.0.22</p>
        </footer>
    </div>
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPDFBT1BWX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CPDFBT1BWX');
    </script>
    
    <script type="module" src="js/game.js"></script>
</body>
</html>
